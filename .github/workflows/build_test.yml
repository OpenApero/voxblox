# Runs on the OpenApero fork of voxblox; builds the vendored deps/ submodules
# together with the repository, so no wstool/rosinstall step is needed.
name: Build Test
on:
  push:
    branches:
    - 'main'
  pull_request:
    branches:
    - 'main'

jobs:
  build:
    runs-on: ubuntu-latest
    container: 'ros:noetic-ros-base-focal'
    steps:
    # Before checkout: the container has no git, and without it checkout falls
    # back to a REST download that cannot fetch submodules.
    - name: Install build tools
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        apt-key adv --keyserver 'hkp://keyserver.ubuntu.com:80' --recv-key C1CF6E31E6BADE8868B172B4F42ED6FBAB17C654
        apt update
        apt install -y python3-pip python3-catkin-tools autoconf libtool git
        pip3 install osrf-pycommon
      shell: bash
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        path: catkin_ws/src/voxblox
    - name: release_build_test
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        cd $GITHUB_WORKSPACE/catkin_ws
        catkin init
        catkin config --extend /opt/ros/noetic
        catkin config --merge-devel
        catkin config --cmake-args -DCMAKE_BUILD_TYPE=Release
        rosdep update --include-eol-distros
        rosdep install --from-paths src --ignore-src -y --rosdistro noetic
        catkin build -j$(nproc) -l$(nproc)
      shell: bash
